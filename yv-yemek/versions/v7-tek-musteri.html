<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>YV Mini Restoran</title>
<style>
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none}
  body{margin:0;font-family:system-ui,sans-serif;background:#fff3e0;color:#4e2a14;min-height:100vh}
  #top{display:flex;justify-content:space-between;align-items:center;padding:8px 14px;background:#ff8a50;color:#fff;font-weight:bold;font-size:18px}
  #customers{display:flex;gap:10px;padding:10px;min-height:150px;justify-content:center;flex-wrap:wrap}
  .cust{background:#fff;border-radius:16px;padding:8px 10px;width:150px;text-align:center;box-shadow:0 3px 8px #0002;cursor:pointer;border:3px solid transparent}
  .cust:hover{border-color:#ff8a50}
  .cust .face{font-size:34px}
  .cust .order{font-size:24px;min-height:30px}
  .bar{height:8px;background:#eee;border-radius:4px;margin-top:6px;overflow:hidden}
  .bar i{display:block;height:100%;background:#4caf50;transition:width .2s linear}
  #tray{margin:6px auto;max-width:520px;background:#fff;border-radius:16px;padding:10px;text-align:center;box-shadow:0 3px 8px #0002}
  #plate{font-size:30px;min-height:44px;letter-spacing:2px}
  #items{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;padding:10px;max-width:560px;margin:auto}
  button{font:inherit;border:0;border-radius:14px;padding:10px 14px;cursor:pointer;background:#ffcc80;font-size:26px;box-shadow:0 3px 0 #c88a2e}
  button:active{transform:translateY(2px);box-shadow:0 1px 0 #c88a2e}
  .act{font-size:18px;font-weight:bold;margin:4px}
  #serve{background:#81c784;box-shadow:0 3px 0 #4a8c4e}
  #trash{background:#e57373;box-shadow:0 3px 0 #a04545}
  #msg{text-align:center;height:24px;font-weight:bold}
  #overlay{position:fixed;inset:0;background:#000a;display:flex;align-items:center;justify-content:center}
  #box{background:#fff;border-radius:20px;padding:24px 30px;text-align:center;max-width:90vw}
  #box h1{margin:0 0 8px}
  #box p{margin:6px 0}
  @media (max-height:520px){
    #top{padding:4px 12px;font-size:15px}
    #customers{min-height:100px;padding:4px;gap:6px}
    .cust{width:120px;padding:4px 6px}
    .cust .face{font-size:22px}.cust .order{font-size:18px;min-height:22px}
    #tray{padding:4px;margin:2px auto}#plate{font-size:22px;min-height:30px}
    #items{padding:4px;gap:5px}button{padding:5px 9px;font-size:20px}.act{font-size:14px;padding:5px 10px}
    #msg{height:18px;font-size:14px}
    #box{padding:14px 22px}
  }
  #home{position:fixed;inset:0;background:linear-gradient(#ffb74d,#ff7043);display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;color:#fff;z-index:5;overflow:hidden}
  #home h1{margin:0;font-size:44px;text-shadow:0 3px 0 #c4491c}
  #home p{margin:6px 0;font-size:18px}
  #home .big{font-size:24px;padding:12px 40px;margin:12px 0 6px;background:#fff;color:#d84315;box-shadow:0 4px 0 #c4491c}
  #home .small{font-size:16px;padding:6px 18px;background:#ffe0b2;color:#8a3b12;box-shadow:0 3px 0 #c88a2e}
  #best{background:#0003;border-radius:12px;padding:4px 14px;font-size:16px;min-height:28px}
  #how{background:#fff;color:#4e2a14;border-radius:14px;padding:10px 16px;max-width:420px;font-size:15px;display:none;text-align:left;margin-top:8px}
  .fly{position:absolute;font-size:36px;opacity:.5;animation:fly 7s linear infinite;pointer-events:none}
  @keyframes fly{from{transform:translateY(110vh) rotate(0)}to{transform:translateY(-20vh) rotate(360deg)}}
  #menu{font-size:14px;padding:2px 10px;margin:0;background:#ffe0b2}
  @media (max-height:520px){#home h1{font-size:30px}#home p{font-size:14px}#home .big{font-size:18px;padding:8px 28px;margin:6px 0 4px}#home .small{font-size:13px;padding:4px 12px}.fly{font-size:26px}#how{font-size:13px;padding:6px 12px}}
  #shop{position:fixed;inset:0;background:#fff3e0;z-index:6;display:none;flex-direction:column;overflow:auto}
  #shophead{display:flex;justify-content:space-between;align-items:center;padding:8px 14px;background:#ff8a50;color:#fff;font-weight:bold;font-size:18px;position:sticky;top:0}
  #shoplist{display:flex;flex-wrap:wrap;gap:10px;padding:10px;justify-content:center}
  .item{background:#fff;border-radius:16px;padding:10px;width:140px;text-align:center;box-shadow:0 3px 8px #0002}
  .item .e{font-size:34px}.item small{display:block;margin:4px 0;font-size:13px}
  .item{flex:none}.item b{display:block}.item button{display:block;margin:6px auto 0;font-size:16px;font-weight:bold;padding:6px 14px;background:#81c784;box-shadow:0 3px 0 #4a8c4e}
  .item button:disabled{background:#ddd;box-shadow:none;cursor:default}
  @media (max-height:520px){#shophead{padding:4px 12px;font-size:15px}.item{width:120px;padding:6px}.item .e{font-size:24px}.item small{font-size:12px}.item button{font-size:14px;padding:4px 10px}}
</style>
</head>
<body>
<div id="home">
  <h1>🍔 YV Mini Restoran</h1>
  <p>Siparişleri hazırla, müşterileri mutlu et!</p>
  <div id="best"></div>
  <button class="act big" id="play">▶ Oyna</button>
  <button class="act small" id="shopbtn">🏪 Mağaza</button>
  <button class="act small" id="howbtn">❓ Nasıl oynanır?</button>
  <div id="how">1. Müşterinin siparişine bak.<br>2. Malzemeleri <b>sırayla</b> tabağa koy.<br>3. Müşteriye tıkla, servis et!<br>Müşteri çok beklerse kızıp gider. 3 müşteri giderse oyun biter.</div>
</div>
<div id="shop">
  <div id="shophead"><button class="act" id="shopback" style="font-size:14px;padding:4px 10px;background:#ffe0b2">⬅ Geri</button><span>🏪 Mağaza</span><span>💰 <b id="wallet">0</b></span></div>
  <div id="shoplist"></div>
</div>
<div id="top"><span>🪙 <b id="coins">0</b></span><span>Gün <b id="day">1</b></span><span><button id="menu" class="act">🏠</button></span><span>🍽️ <b id="served">0</b>/<b id="goal">0</b></span><span id="lives"></span></div>
<div id="customers"></div>
<div id="msg"></div>
<div id="tray">
  <div>Tabağın:</div>
  <div id="plate"></div>
  <button class="act" id="serve">✅ Servis et</button>
  <button class="act" id="trash">🗑️ Çöpe at</button>
</div>
<div id="items"></div>
<div id="overlay"><div id="box"></div></div>

<script>
// Menu: each dish is an ordered list of ingredients
var MENU = [
  {name:'Hamburger', parts:['🍞','🥩','🥬','🍞']},
  {name:'Peynirli tost', parts:['🍞','🧀','🍞']},
  {name:'Pizza', parts:['🫓','🍅','🧀','🍄']},
  {name:'Salata', parts:['🥬','🍅','🥒']},
  {name:'Sosisli', parts:['🍞','🌭','🧅']},
  {name:'Taco', parts:['🌮','🥩','🥬','🧀']}
];
var FACES = ['😀','😎','🥰','🤠','🐱','🐶','🐰','🦊'];
var ALL = ['🍞','🥩','🥬','🧀','🫓','🍅','🍄','🥒','🌭','🧅','🌮'];

var coins, day, lives, served, goal, custs, plate, running, timer, spawn;

function $(id){ return document.getElementById(id); }

function say(t){ $('msg').textContent = t; }

// Shop sells single ingredients only; extra dishes appear in orders once all their ingredients are owned
var SHOP = [
  {id:'🥓', name:'Pastırma', price:40},
  {id:'🍳', name:'Yumurta', price:60},
  {id:'🍟', name:'Patates', price:80},
  {id:'🍤', name:'Karides', price:100},
  {id:'🥞', name:'Pankek', price:70},
  {id:'🍯', name:'Bal', price:70}
];
var EXTRA_DISHES = [
  {name:'Pastırmalı tost', parts:['🍞','🥓','🧀','🍞']},
  {name:'Yumurtalı sandviç', parts:['🍞','🍳','🍅','🍞']},
  {name:'Patates tabağı', parts:['🍟','🧀','🧅']},
  {name:'Karidesli taco', parts:['🌮','🍤','🥬','🧀']},
  {name:'Ballı pankek', parts:['🥞','🍯','🥞']}
];

// Save data lives in this browser only
// v5 saved bundle names; turn them into single ingredients
var OLD_IDS = {pastirma:['🥓'], yumurta:['🍳'], patates:['🍟'], karides:['🍤'], pankek:['🥞','🍯']};
function migrateOwned(list){
  var out = [];
  list.forEach(function(x){ (OLD_IDS[x] || [x]).forEach(function(e){ if(out.indexOf(e) < 0 && SHOP.some(function(it){ return it.id === e; })) out.push(e); }); });
  return out;
}

function getSave(){
  var d = {day:0, coins:0, bank:0, owned:[]};
  try{ var r = JSON.parse(localStorage.getItem('yvYemekBest')); if(r){ d.day = r.day||0; d.coins = r.coins||0; d.bank = r.bank||0; d.owned = migrateOwned(r.owned||[]); } }catch(e){}
  return d;
}
function setSave(d){ try{ localStorage.setItem('yvYemekBest', JSON.stringify(d)); }catch(e){} }

// Ingredients and dishes available right now (base + bought)
function allIngredients(){ return ALL.concat(getSave().owned); }
function extraDishes(){
  var have = allIngredients();
  return EXTRA_DISHES.filter(function(d){ return d.parts.every(function(p){ return have.indexOf(p) >= 0; }); });
}

function buildItems(){
  $('items').innerHTML = '';
  allIngredients().forEach(function(e){
    var b = document.createElement('button');
    b.textContent = e;
    b.onclick = function(){ if(running && plate.length < 6){ plate.push(e); drawPlate(); } };
    $('items').appendChild(b);
  });
}

function showShop(){
  var sv = getSave();
  $('wallet').textContent = sv.bank;
  var box = $('shoplist'); box.innerHTML = '';
  SHOP.forEach(function(it){
    var has = sv.owned.indexOf(it.id) >= 0;
    var el = document.createElement('div'); el.className = 'item';
    el.innerHTML = '<div class="e">'+it.id+'</div><b>'+it.name+'</b>';
    var b = document.createElement('button');
    b.textContent = has ? '✓ Sende var' : '🪙 '+it.price;
    b.disabled = has || sv.bank < it.price;
    b.onclick = function(){
      var d = getSave();
      if(d.bank >= it.price && d.owned.indexOf(it.id) < 0){ d.bank -= it.price; d.owned.push(it.id); setSave(d); showShop(); }
    };
    el.appendChild(b); box.appendChild(el);
  });
  $('shop').style.display = 'flex';
}

function drawPlate(){ $('plate').textContent = plate.join(' '); }

function startDay(){
  lives = 3; served = 0; goal = 4 + day*2; custs = []; plate = [];
  running = true;
  buildItems();
  $('overlay').style.display = 'none';
  drawPlate(); render(); say('Müşteriye tıklayarak tabağı servis et!');
  newCustomer();
  clearInterval(timer);
  timer = setInterval(tick, 1000);
}

function newCustomer(){
  var max = 1; // one customer at a time
  if(custs.length < max){
    var dishes = MENU.slice(0, Math.min(3 + day, MENU.length)).concat(extraDishes());
    var d = dishes[Math.floor(Math.random()*dishes.length)];
    var pat = Math.max(40, 70 - day*3);
    custs.push({dish:d, face:FACES[Math.floor(Math.random()*FACES.length)], pat:pat, max:pat});
    render();
  }
  clearTimeout(spawn);
  spawn = setTimeout(function(){ if(running) newCustomer(); }, 1500 + Math.random()*1000);
}

function tick(){
  custs.forEach(function(c){ c.pat--; });
  var left = custs.filter(function(c){ return c.pat > 0; });
  if(left.length < custs.length){ lives -= (custs.length - left.length); say('😢 Bir müşteri kızıp gitti!'); }
  custs = left;
  render();
  if(lives <= 0) endDay(false);
}

function render(){
  $('coins').textContent = coins; $('day').textContent = day; $('served').textContent = served; $('goal').textContent = goal; $('lives').textContent = '❤️'.repeat(Math.max(0,lives)) + '🖤'.repeat(Math.max(0,3-lives));
  var box = $('customers'); box.innerHTML = '';
  custs.forEach(function(c, i){
    var el = document.createElement('div'); el.className = 'cust';
    el.innerHTML = '<div class="face">'+c.face+'</div><div><b>'+c.dish.name+'</b></div><div class="order">'+c.dish.parts.join('')+'</div><div class="bar"><i style="width:'+(c.pat/c.max*100)+'%"></i></div>';
    el.onclick = function(){ serve(i); };
    box.appendChild(el);
  });
}

function serve(i){
  if(!running) return;
  var c = custs[i], ok = plate.join('') === c.dish.parts.join('');
  if(ok){
    var gain = 10 + Math.ceil(c.pat/c.max*10);
    coins += gain; var sv = getSave(); sv.bank += gain; setSave(sv); say('😋 Harika! +'+gain);
    custs.splice(i,1); plate = []; served++;
  } else {
    say('🤔 Bu sipariş değil! Sıraya dikkat et.');
  }
  drawPlate(); render();
  if(served >= goal) endDay(true);
}

$('serve').onclick = function(){ if(custs.length === 1) serve(0); else say('Hangi müşteriye? Müşteriye tıkla!'); };
$('trash').onclick = function(){ plate = []; drawPlate(); };

function endDay(win){
  running = false; clearInterval(timer); clearTimeout(spawn);
  saveBest();
  $('overlay').style.display = 'flex';
  $('box').innerHTML = '<h1>'+(win?'🎉 Gün bitti!':'😅 Olmadı')+'</h1><p>Servis: 🍽️ '+served+'/'+goal+'</p><p>Altın: 🪙 '+coins+'</p>'
    + '<button class="act" id="next">'+(win?'Sonraki gün ▶':'Tekrar dene')+'</button> <button class="act" id="tohome">🏠 Ana ekran</button>';
  $('tohome').onclick = function(){ showHome(); };
  $('next').onclick = function(){ if(win){ day++; } else { day = 1; coins = 0; } startDay(); };
}

var FLY = ['🍔','🍕','🌭','🌮','🥗','🧀','🍅','🍟'];
for(var k=0;k<12;k++){
  var fl = document.createElement('div'); fl.className = 'fly'; fl.textContent = FLY[k % FLY.length];
  fl.style.left = (k*8+2)+'%'; fl.style.animationDelay = (-k*0.6)+'s'; fl.style.animationDuration = (5+k%4*2)+'s';
  $('home').appendChild(fl);
}

function saveBest(){
  var b = getSave();
  if(day > b.day) b.day = day;
  if(coins > b.coins) b.coins = coins;
  setSave(b);
}

function showHome(){
  running = false; clearInterval(timer); clearTimeout(spawn);
  $('overlay').style.display = 'none';
  var b = getSave();
  $('best').textContent = (b.day ? '🏆 En yüksek gün: '+b.day+'  ·  ' : '') + '💰 Cüzdan: '+b.bank;
  $('home').style.display = 'flex';
}

$('play').onclick = function(){ coins = 0; day = 1; $('home').style.display = 'none'; startDay(); };
$('howbtn').onclick = function(){ var h = $('how'); h.style.display = h.style.display === 'block' ? 'none' : 'block'; };
$('shopbtn').onclick = showShop;
$('shopback').onclick = function(){ $('shop').style.display = 'none'; showHome(); };
$('menu').onclick = function(){ saveBest(); showHome(); };

coins = 0; day = 1; running = false;
$('overlay').style.display = 'none';
showHome();

</script>
</body>
</html>
