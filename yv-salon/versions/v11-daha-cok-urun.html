function toRGB(c) {
  if (c[0] === '#') { const n = parseInt(c.slice(1), 16); return [n >> 16 & 255, n >> 8 & 255, n & 255]; }
  const m = c.match(/[\d.]+/g); return [+m[0], +m[1], +m[2]];
}
function mix(a, b, t) { const A = toRGB(a), B = toRGB(b); return `rgb(${A.map((v, i) => Math.round(v + (B[i] - v) * t)).join(',')})`; }

// ---------- drawing helpers ----------
function rr(x, y, w, h, r) { r = Math.max(0, Math.min(r, w / 2, h / 2)); ctx.beginPath(); ctx.moveTo(x + r, y); ctx.arcTo(x + w, y, x + w, y + h, r); ctx.arcTo(x + w, y + h, x, y + h, r); ctx.arcTo(x, y + h, x, y, r); ctx.arcTo(x, y, x + w, y, r); ctx.closePath(); }
function circle(x, y, r) { ctx.beginPath(); ctx.arc(x, y, r, 0, Math.PI * 2); ctx.fill(); }
function ell(x, y, rx, ry, rot = 0) { ctx.beginPath(); ctx.ellipse(x, y, rx, ry, rot, 0, Math.PI * 2); ctx.fill(); }
function line(a, b, c, d) { ctx.beginPath(); ctx.moveTo(a, b); ctx.lineTo(c, d); ctx.stroke(); }
function heart(x, y, s) { ctx.beginPath(); ctx.moveTo(x, y + s); ctx.bezierCurveTo(x - s * 1.6, y - s * 0.2, x - s * 0.7, y - s * 1.4, x, y - s * 0.5); ctx.bezierCurveTo(x + s * 0.7, y - s * 1.4, x + s * 1.6, y - s * 0.2, x, y + s); ctx.fill(); }

  if (!ac) return;
  const t = ac.currentTime + delay, o = ac.createOscillator(), g = ac.createGain();
  o.type = type; o.frequency.setValueAtTime(f0, t); o.frequency.exponentialRampToValueAtTime(f1, t + dur);
  g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(0.001, t + dur);
  o.connect(g).connect(ac.destination); o.start(t); o.stop(t + dur + 0.02);
}

  if (!ac) return;
  const n = Math.floor(ac.sampleRate * dur), b = ac.createBuffer(1, n, ac.sampleRate), d = b.getChannelData(0);

  s.buffer = b; f.type = 'bandpass'; f.frequency.value = freq; g.gain.value = vol;

}

  const code = await myCode();
  openModal(`<h2>👭 Arkadaşlar</h2>
    <div>Adın: <b>${esc(profile.name)}</b> • Numaran: <span class="id">#${profile.id}${profile.id === ADMIN_ID ? ' 👑' : ''}</span> <button class="mb s" id="ren" style="font-size:15px;padding:4px 10px">✏️ İsim • ${RENAME_PRICE} TL</button></div>
    <p><b>💌 Davet kodun</b> — arkadaşına gönder:</p>
    <textarea id="mycode" readonly>${code}</textarea>
    <button class="mb y" id="copy">📋 Kopyala</button>${navigator.share ? '<button class="mb" id="share">📤 Paylaş</button>' : ''}
    <p><b>➕ Arkadaş ekle</b> — arkadaşının kodunu buraya yapıştır:</p>
    <input id="fcode" placeholder="YV-..." autocomplete="off"><div class="msg" id="fmsg"></div>
    <button class="mb g" id="fadd">Ekle</button>
    <div id="flist"></div>
    <button class="mb s" id="fclose">Kapat</button>`);
  renderFriends();
  $('copy').onclick = () => {
    $('mycode').select();
    const done = () => { $('copy').textContent = '✅ Kopyalandı'; };
    if (navigator.clipboard) navigator.clipboard.writeText(code).then(done, () => { document.execCommand('copy'); done(); }); else { document.execCommand('copy'); done(); }
  };
  if ($('share')) $('share').onclick = () => navigator.share({ title: 'YV Güzellik Salonu', text: `${profile.name} seni güzellik salonuna davet ediyor! 💅 Oyunda 👭 Arkadaşlar'a bu kodu yapıştır: ${code}` }).catch(() => { });
  const add = async () => {
    const f = await readCode($('fcode').value), msg = $('fmsg');
    msg.style.color = '#c0392b';
    if (f && f.fake) { msg.textContent = 'Bu sahte bir admin kodu! 🚫 Tek admin var.'; sfx('no'); return; }
    if (!f) { msg.textContent = 'Bu kod çalışmadı 😕 Kodun tamamını kopyaladığından emin ol.'; return; }
    if (f.id === profile.id) { msg.textContent = 'Bu senin kendi kodun 😊'; return; }
    if (f.id === ADMIN_ID) f.verified = true;
    const i = friends.findIndex(x => x.id === f.id);
    if (i >= 0) friends[i] = f; else friends.push(f);
    save(); sfx('coin');
    msg.style.color = '#23884f'; msg.textContent = i >= 0 ? `${f.name} güncellendi! 🔄` : `${f.name} artık arkadaşın! 🎉`;
    $('fcode').value = ''; renderFriends();
  };
  $('fadd').onclick = add; $('fcode').onkeydown = e => { if (e.key === 'Enter') add(); };
  $('fclose').onclick = closeModal;
  $('ren').onclick = askRename;
}
function renderFriends() {
  $('flist').innerHTML = friends.length
    ? friends.map((f, i) => `<div class="fr"><b>${f.id === ADMIN_ID ? '👑' : '👧'} ${esc(f.name)} <small>#${f.id}${f.id === ADMIN_ID ? ' Admin' : ''}</small><br><small>💰 ${f.money} TL • 👩 ${f.served} müşteri</small></b><button class="mb" data-v="${i}">🏠 Git</button><button class="mb s" data-d="${i}">🗑️</button></div>`).join('')
    : '<p>Henüz arkadaşın yok. Kodunu gönder, onların kodunu ekle!</p>';
  $('flist').querySelectorAll('[data-v]').forEach(b => b.onclick = () => goVisit(friends[+b.dataset.v]));
  $('flist').querySelectorAll('[data-d]').forEach(b => b.onclick = () => { if (confirm(`${friends[+b.dataset.d].name} silinsin mi?`)) { friends.splice(+b.dataset.d, 1); save(); renderFriends(); } });
}
// the friend greets you in their salon (a tidy, happy look made up on the spot)
function goVisit(f) {
  const c = makeCustomer(false);
  c.name = f.name; c.beard = []; c.greasy = 0; c.specks = []; c.strays = [];
  for (const st of c.strands) { st.tangle = 0; st.wet = 0; }
  visit = { ...f, char: c }; closeModal(); go('visit'); sfx('done');
}
function askRename() {
  openModal(`<h2>✏️ İsim değiştir</h2><p>Yeni ismin ne olsun? Ücreti <b>💰 ${RENAME_PRICE} TL</b> (sende ${money} TL var)</p>
    <input id="nm" maxlength="14" value="${esc(profile.name)}" autocomplete="off"><div class="msg" id="nmsg"></div>
    <button class="mb g" id="nok">Değiştir • ${RENAME_PRICE} TL</button><button class="mb s" id="ncancel">Vazgeç</button>`);
  const inp = $('nm'); inp.focus(); inp.select();
  const ok = () => {
    const n = inp.value.trim(), msg = $('nmsg');
    if (n.length < 2) { msg.textContent = 'En az 2 harf yaz 🙂'; return; }
    if (n === profile.name) { msg.textContent = 'Bu zaten senin adın 😊'; return; }
    if (money < RENAME_PRICE) { msg.textContent = `${RENAME_PRICE - money} TL daha lazım 💸 Müşterilere bak, para kazan`; sfx('no'); return; }
    money -= RENAME_PRICE; profile.name = n; save(); closeModal();
    sfx('coin'); say(`Yeni adın: ${n} ✨`);
  };
  $('nok').onclick = ok; inp.onkeydown = e => { if (e.key === 'Enter') ok(); };
  $('ncancel').onclick = closeModal;
}
function askAdmin() {
  openModal(`<h2>👑 Admin</h2><p>Admin şifresini yaz:</p>
    <input id="ap" type="password" placeholder="Şifre" autocomplete="off"><div class="msg" id="amsg"></div>
    <button class="mb g" id="aok">Tamam</button><button class="mb s" id="acancel">Vazgeç</button>`);
  const inp = $('ap'); inp.focus();
  const ok = async () => {
    $('amsg').style.color = '#6b5a70'; $('amsg').textContent = 'Kontrol ediliyor... 🔍';
    const d = await passToD(inp.value.trim()), k = d && await unlockAdmin(d);
    $('amsg').style.color = '';
    if (!k) { $('amsg').textContent = 'Şifre yanlış 🔒'; sfx('no'); return; }
    adminKey = k; try { localStorage.setItem('yv-salon-admin', d); } catch (e) { }
    profile.id = ADMIN_ID; save(); closeModal();
    sfx('done'); sparkle(640, 340, 30); say('👑 Artık adminsin! Numaran #000000');
  };
  $('aok').onclick = ok; inp.onkeydown = e => { if (e.key === 'Enter') ok(); };
  $('acancel').onclick = closeModal;
}
// on this device: keep the admin number only while the real admin key is here
const adminReady = (async () => {
  let tok = null; try { tok = localStorage.getItem('yv-salon-admin'); } catch (e) { }
  if (tok) adminKey = await unlockAdmin(tok);
  if (profile && profile.id === ADMIN_ID && !adminKey) { profile.id = newId(); save(); }
  friends = friends.filter(f => f.id !== ADMIN_ID || f.verified);
})();
if (!profile) askName();

let last = performance.now();
function frame(now) {
  const dt = Math.min(0.05, (now - last) / 1000); last = now;
  update(dt); draw();
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
</script>
</body>
</html>
