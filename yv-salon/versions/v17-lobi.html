  // sleeping at home refills sleep
  if (LB.sleepT > 0) { LB.sleepT -= dt; n.sleep = Math.min(100, n.sleep + dt * 30); if (LB.sleepT <= 0) { n.sleep = 100; save(); sfx('done'); say('Günaydın! Enerjin doldu ☀️'); } }
  const me = LB.me;
  let vx = 0, vz = 0;
  if (scene === 'lobby') {
    let ix = 0, iz = 0;
    if (keys3.has('KeyW') || keys3.has('ArrowUp')) iz -= 1;
    if (keys3.has('KeyS') || keys3.has('ArrowDown')) iz += 1;
    if (keys3.has('KeyA') || keys3.has('ArrowLeft')) ix -= 1;
    if (keys3.has('KeyD') || keys3.has('ArrowRight')) ix += 1;
    const fx = -Math.sin(LB.yaw), fz = -Math.cos(LB.yaw), rx = Math.cos(LB.yaw), rz = -Math.sin(LB.yaw);
    if (ix || iz) { LB.target = null; const l = Math.hypot(ix, iz); vx = (fx * -iz + rx * ix) / l; vz = (fz * -iz + rz * ix) / l; }
    else if (LB.target) { const dx = LB.target.x - me.position.x, dz = LB.target.z - me.position.z, d = Math.hypot(dx, dz); if (d < 0.3) LB.target = null; else { vx = dx / d; vz = dz / d; } }
  }
  const spd = tired ? 2.4 : 5.5;
  me.position.x += vx * spd * dt; me.position.z += vz * spd * dt; lbCollide(me.position);
  if (vx || vz) { const ang = Math.atan2(vx, vz); me.rotation.y += Math.atan2(Math.sin(ang - me.rotation.y), Math.cos(ang - me.rotation.y)) * Math.min(1, dt * 12); }
  lbAnim(me, dt, vx || vz ? spd : 0);
  // pet follows
  if (LB.pet) {
    const bx = me.position.x - Math.sin(me.rotation.y) * 1.3 + Math.cos(me.rotation.y) * 0.9, bz = me.position.z - Math.cos(me.rotation.y) * 1.3 - Math.sin(me.rotation.y) * 0.9;
    const dx = bx - LB.pet.position.x, dz = bz - LB.pet.position.z, d = Math.hypot(dx, dz);
    if (d > 0.2) { const s = Math.min(d, dt * Math.max(3, d * 3)); LB.pet.position.x += dx / d * s; LB.pet.position.z += dz / d * s; LB.pet.rotation.y = Math.atan2(dx, dz); LB.pet.position.y = Math.abs(Math.sin(T * 10)) * 0.15; } else LB.pet.position.y = 0;
  }
  // townspeople wander around, stop, say hi
  for (const np of LB.npcs) {
    const p = np.av.position;
    if (!np.target && (np.wait -= dt) <= 0) { const a = Math.random() * 6.28, R = 5 + Math.random() * 15; np.target = new THREE.Vector3(Math.sin(a) * R, 0, Math.cos(a) * R); }
    let s = 0;
    if (np.target) {
      const dx = np.target.x - p.x, dz = np.target.z - p.z, d = Math.hypot(dx, dz);
      if (d < 0.4) { np.target = null; np.wait = 2 + Math.random() * 5; if (Math.random() < 0.3) lbSay(np.av, pick(['👋', '😊', '💖', '🍦', '🌸', '😄', 'Merhaba!', 'Ne güzel bir gün!'])); }
      else { s = 2.2; p.x += dx / d * s * dt; p.z += dz / d * s * dt; lbCollide(p); np.av.rotation.y = Math.atan2(dx, dz); }
    }
    // wave back when you come close
    if (!np.av.userData.A.bubble && Math.hypot(p.x - me.position.x, p.z - me.position.z) < 2.5 && Math.random() < dt * 0.4) lbSay(np.av, '👋');
    lbAnim(np.av, dt, s);
  }
  // near a door?
  LB.near = scene === 'lobby' ? LB.places.find(pl => Math.hypot(pl.door.x - me.position.x, pl.door.z - me.position.z) < 3.2) || null : null;
  // camera follows from behind
  const cp = new THREE.Vector3(me.position.x + Math.sin(LB.yaw) * 10, 6.2, me.position.z + Math.cos(LB.yaw) * 10);
  LB.cam.position.lerp(cp, 1 - Math.exp(-dt * 6)); LB.cam.lookAt(me.position.x, 1.6, me.position.z);
  // fountain water, clouds, butterflies, tap marker
  const pa = LB.jet.geometry.attributes.position;
  LB.drops.forEach((q, i) => { q.t = (q.t + dt * q.sp) % 1; const r = q.t * 1.3, y = 3.1 + Math.sin(q.t * Math.PI) * 1.4 - q.t * 1.2; pa.setXYZ(i, Math.cos(q.a) * r, y, Math.sin(q.a) * r); });
  pa.needsUpdate = true;
  for (const c of LB.clouds) { c.position.x += dt * 1.2; if (c.position.x > 110) c.position.x = -110; }
  for (const b of LB.flies) { const u = b.userData; u.a += dt * u.sp; b.position.set(Math.sin(u.a) * u.r, u.h + Math.sin(T * 2 + u.a * 3) * 0.4, -Math.cos(u.a) * u.r); b.rotation.y = -u.a; const fl = Math.sin(T * 18 + u.r) * 0.9; b.children[0].rotation.y = fl; b.children[1].rotation.y = -fl; }
  LB.tapMark.material.opacity = Math.max(0, LB.tapMark.material.opacity - dt * 1.2);
  if (LB.tipT > 0) LB.tipT -= dt;
}
// pointer in the lobby: drag = turn the camera, tap = walk there
function lbDown() { LB.drag = { x: ptr.x, moved: 0 }; }
function lbMove() { if (!LB.drag) return; const dx = ptr.x - ptr.px; LB.drag.moved += Math.abs(dx) + Math.abs(ptr.y - ptr.py); if (LB.drag.moved > 10) LB.yaw -= dx * 0.008; }
function lbUp() {
  const dr = LB.drag; LB.drag = null;
  if (!dr || dr.moved > 10 || !LB.ok) return;
  const rc = new THREE.Raycaster(); rc.setFromCamera({ x: ptr.x / W * 2 - 1, y: -(ptr.y / H * 2 - 1) }, LB.cam);
  const hit = rc.ray.intersectPlane(new THREE.Plane(new THREE.Vector3(0, 1, 0), 0), new THREE.Vector3());
  if (!hit) return;
  // tapping a building walks you to its door
  const b = LB.places.find(p => Math.hypot(hit.x - p.pos.x, hit.z - p.pos.z) < 6.5);
  LB.target = b ? b.door.clone() : hit; lbCollide(LB.target, 0.3);
  LB.tapMark.position.set(LB.target.x, 0.05, LB.target.z); LB.tapMark.material.opacity = 1;
}

// ---------- lobby HUD and the places you can go in ----------
const CAFE_MENU = [['🍰', 'Çilekli pasta', 8, 35], ['🥪', 'Sandviç', 6, 25], ['🍪', 'Kurabiye', 4, 15], ['🥤', 'Meyve suyu', 3, 10]];
const ICE_MENU = [['🍦', 'Külah dondurma', 5, 20], ['🍨', 'Kase dondurma', 7, 28], ['🥛', 'Milkshake', 6, 22]];
function lbBuy([emo, name, price, gain]) {
  const n = needs();
  if (n.hunger >= 100) return say('Karnın tok! 😊');
  if (!rich() && money < price) { sfx('no'); return say(`${price - money} TL daha lazım 💸 Salonda çalış, para kazan`); }
  if (!rich()) money -= price;
  n.hunger = Math.min(100, n.hunger + gain); save(); sfx('coin');
  part({ x: 640, y: 380, vy: -60, life: 1.2, kind: 'txt', t: `${emo} Nyam! +${gain}`, col: '#23884f' }); sparkle(640, 380, 12);
}
function needBar(x, y, label, v) {
  text(label, x, y + 16, 17, '#3a2340', 'left', 800);
  ctx.fillStyle = '#f1d6e4'; rr(x + 96, y + 2, 180, 20, 10); ctx.fill();
  ctx.fillStyle = v > 50 ? '#2fbf71' : v > 25 ? '#ffb800' : '#e8434f'; rr(x + 96, y + 2, Math.max(20, 180 * v / 100), 20, 10); ctx.fill();
  text(Math.round(v) + '%', x + 186, y + 17, 14, '#ffffff', 'center', 800);
}
function drawLobby() {
  if (LB.ok) LB.renderer.render(LB.scene, LB.cam);
  ctx.clearRect(0, 0, W, H);
  const n = needs();
  ctx.fillStyle = 'rgba(255,255,255,.92)'; rr(16, 16, 300, 84, 18); ctx.fill();
  needBar(30, 26, '🍔 Açlık', n.hunger); needBar(30, 60, '😴 Uyku', n.sleep);
  moneyPill(1062, 16);
  btn(1062, 72, 200, 44, '🏠 Ana menü', () => { save(); go('title'); }, { size: 18 });
  if (scene === 'lobby') {
    // quick chat: emojis and ready-made sentences only (safe for kids)
    const EMO = ['👋', '😊', '😂', '💖', '👍', '🍦'];
    EMO.forEach((e, i) => btn(16 + i * 58, 650, 52, 52, e, () => lbSay(LB.me, e), { size: 24 }));
    btn(368, 650, 70, 52, '💬', () => { LB.phr = !LB.phr; }, { active: LB.phr, size: 24 });
    if (LB.phr) ['Merhaba!', 'Nasılsın?', 'Hadi oynayalım!', 'Çok güzelsin!', 'Görüşürüz!'].forEach((t, i) => btn(368, 596 - i * 50, 200, 44, t, () => { lbSay(LB.me, t); LB.phr = false; }, { size: 17 }));
    if (LB.near) btn(470, 600, 340, 64, `🚪 ${LB.near.icon} ${LB.near.name}`, () => lbEnter(LB.near), { col: '#27b36a', fg: '#ffffff', size: 22 });
    if (LB.tipT > 0) { ctx.globalAlpha = Math.min(1, LB.tipT); ctx.fillStyle = 'rgba(58,35,64,.85)'; rr(340, 16, 600, 64, 20); ctx.fill(); text('Yürümek için yere dokun ya da W A S D / ok tuşları', 640, 42, 19, '#ffffff', 'center', 800); text('Etrafa bakmak için sürükle • Kapıya gelince içeri gir', 640, 68, 16, '#ffd6ea', 'center', 700); ctx.globalAlpha = 1; }
  } else if (scene === 'place') drawPlace();
}
function drawPlace() {
  const p = LB.place, n = needs();
  ctx.fillStyle = LB.sleepT > 0 ? `rgba(20,20,60,${Math.min(0.85, 0.3 + (4 - LB.sleepT) * 0.2)})` : 'rgba(40,20,50,.45)'; ctx.fillRect(0, 0, W, H);
  if (LB.sleepT > 0) { for (let i = 0; i < 3; i++) text('Z', 640 + i * 40 + Math.sin(T * 2 + i) * 10, 360 - i * 40 - ((T * 30) % 40), 40 + i * 12, '#ffffff', 'center', 800); text('😴 Uyuyorsun...', 640, 470, 30, '#ffffff', 'center', 800); return; }
  ctx.fillStyle = '#ffffff'; ctx.shadowColor = 'rgba(0,0,0,.3)'; ctx.shadowBlur = 24; rr(190, 110, 900, 520, 30); ctx.fill(); ctx.shadowBlur = 0;
  text(`${p.icon} ${p.name}`, 640, 168, 40, '#d6337f', 'center', 800);
  if (p.id === 'cafe' || p.id === 'icecream') {
    const menu = p.id === 'cafe' ? CAFE_MENU : ICE_MENU, w = 190;
    text('Bir şey al, açlığın gitsin!', 640, 206, 20, '#6b5a70', 'center', 700);
    menu.forEach((it, i) => {
      const x = 640 - (menu.length * (w + 16) - 16) / 2 + i * (w + 16), y = 232;
      ctx.fillStyle = '#fff0f7'; rr(x, y, w, 230, 20); ctx.fill();
      emoji(it[0], x + w / 2, y + 62, 64);
      text(it[1], x + w / 2, y + 130, 19, '#3a2340', 'center', 800);
      text(`+${it[3]} tokluk`, x + w / 2, y + 156, 15, '#23884f', 'center', 700);
      btn(x + 20, y + 170, w - 40, 44, rich() ? 'Al • ∞' : `Al • ${it[2]} TL`, () => lbBuy(it), { col: '#27b36a', fg: '#ffffff', size: 18 });
    });
    text('💼 Burada çalışıp para kazanmak yakında geliyor!', 640, 500, 18, '#8b5cf6', 'center', 800);
  } else if (p.id === 'home') {
    // cosy bedroom
    ctx.fillStyle = '#e9d5ff'; rr(240, 200, 800, 300, 20); ctx.fill();
    ctx.fillStyle = '#1e2f6b'; rr(300, 230, 160, 120, 12); ctx.fill(); ctx.fillStyle = '#fff6c8'; circle(410, 270, 22); ctx.fillStyle = '#1e2f6b'; circle(420, 262, 20); ctx.fillStyle = '#ffffff'; star4(340, 260, 5); star4(370, 310, 4);
    const bedCol = normLook(profile.look).cloth;
    ctx.fillStyle = '#c98b5a'; rr(560, 300, 380, 150, 16); ctx.fill(); ctx.fillStyle = '#ffffff'; rr(590, 290, 110, 60, 20); ctx.fill();
    ctx.fillStyle = bedCol; rr(680, 300, 250, 120, 16); ctx.fill(); ctx.fillStyle = 'rgba(255,255,255,.4)'; for (let i = 0; i < 4; i++) heart(720 + i * 55, 360, 9);
    text(`😴 Uyku: ${Math.round(n.sleep)}%`, 640, 540, 22, '#3a2340', 'center', 800);
    btn(530, 560, 220, 56, '😴 Uyu', () => { if (n.sleep >= 100) return say('Hiç uykun yok! 😊'); LB.sleepT = 4; sfx('pop'); }, { col: '#8b5cf6', fg: '#ffffff', size: 24 });
  } else if (p.id === 'hospital') {
    text('🩺 Muayene ol: doktor seni kontrol eder', 640, 250, 22, '#3a2340', 'center', 800);
    text('Açlık ve uykun biraz düzelir', 640, 282, 18, '#6b5a70', 'center', 700);
    emoji('🩺', 640, 370, 90);
    btn(520, 440, 240, 56, rich() ? '🩺 Muayene • ∞' : '🩺 Muayene • 8 TL', () => {
      if (!rich() && money < 8) { sfx('no'); return say('8 TL lazım 💸'); }
      if (!rich()) money -= 8; n.hunger = Math.min(100, n.hunger + 20); n.sleep = Math.min(100, n.sleep + 20); save(); sfx('done'); say('Doktor: "Maşallah, turp gibisin!" 💪');
    }, { col: '#e8434f', fg: '#ffffff', size: 20 });
    text('💼 Burada doktor olmak yakında geliyor!', 640, 530, 18, '#8b5cf6', 'center', 800);
  } else if (p.id === 'flowers') {
    emoji('💐', 640, 330, 110);
    text('Yakında burada buket hazırlayıp satabileceksin! 🌷', 640, 450, 22, '#3a2340', 'center', 800);
  }
  btn(900, 126, 170, 44, '⬅ Lobiye dön', () => { scene = 'lobby'; fade = 0.5; }, { size: 18 });
}

let last = performance.now();
function frame(now) {
  const dt = Math.min(0.05, (now - last) / 1000); last = now;
  update(dt); draw();
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
</script>
