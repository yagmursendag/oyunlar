<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>YV Güzellik Salonu</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;700;800&display=swap" rel="stylesheet">
<style>
  html,body{margin:0;height:100%;background:#3a1f3d;overflow:hidden}
  body{display:flex;align-items:center;justify-content:center}
  canvas{display:block;touch-action:none;user-select:none}
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
// ---------- setup ----------
const cv = document.getElementById('c');
let ctx = cv.getContext('2d');
const W = 1280, H = 720, PANEL = 1000; // scene 0..PANEL, tool panel on the right while working
const FONT = '"Baloo 2", system-ui, "Segoe UI", sans-serif';
let scale = 1, dpr = 1;
function resize() {
  dpr = window.devicePixelRatio || 1;
  scale = Math.min(innerWidth / W, innerHeight / H);
  cv.style.width = W * scale + 'px'; cv.style.height = H * scale + 'px';
  cv.width = Math.round(W * scale * dpr); cv.height = Math.round(H * scale * dpr);
}
addEventListener('resize', resize); resize();

const rand = (a, b) => a + Math.random() * (b - a);
const pick = a => a[Math.floor(Math.random() * a.length)];
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const dist = (a, b, c, d) => Math.hypot(a - c, b - d);
function toRGB(c) {
  if (c[0] === '#') { const n = parseInt(c.slice(1), 16); return [n >> 16 & 255, n >> 8 & 255, n & 255]; }
  const m = c.match(/[\d.]+/g); return [+m[0], +m[1], +m[2]];
}
function mix(a, b, t) { const A = toRGB(a), B = toRGB(b); return `rgb(${A.map((v, i) => Math.round(v + (B[i] - v) * t)).join(',')})`; }

// ---------- drawing helpers ----------
function rr(x, y, w, h, r) { r = Math.max(0, Math.min(r, w / 2, h / 2)); ctx.beginPath(); ctx.moveTo(x + r, y); ctx.arcTo(x + w, y, x + w, y + h, r); ctx.arcTo(x + w, y + h, x, y + h, r); ctx.arcTo(x, y + h, x, y, r); ctx.arcTo(x, y, x + w, y, r); ctx.closePath(); }
function circle(x, y, r) { ctx.beginPath(); ctx.arc(x, y, r, 0, Math.PI * 2); ctx.fill(); }
function ell(x, y, rx, ry, rot = 0) { ctx.beginPath(); ctx.ellipse(x, y, rx, ry, rot, 0, Math.PI * 2); ctx.fill(); }
function line(a, b, c, d) { ctx.beginPath(); ctx.moveTo(a, b); ctx.lineTo(c, d); ctx.stroke(); }
function heart(x, y, s) { ctx.beginPath(); ctx.moveTo(x, y + s); ctx.bezierCurveTo(x - s * 1.6, y - s * 0.2, x - s * 0.7, y - s * 1.4, x, y - s * 0.5); ctx.bezierCurveTo(x + s * 0.7, y - s * 1.4, x + s * 1.6, y - s * 0.2, x, y + s); ctx.fill(); }
function star4(x, y, r) { ctx.beginPath(); for (let i = 0; i < 8; i++) { const a = i * Math.PI / 4, k = i % 2 ? r * 0.3 : r; ctx.lineTo(x + Math.cos(a) * k, y + Math.sin(a) * k); } ctx.closePath(); ctx.fill(); }
function text(s, x, y, size, col, align = 'left', weight = 700) { ctx.font = `${weight} ${size}px ${FONT}`; ctx.fillStyle = col; ctx.textAlign = align; ctx.textBaseline = 'alphabetic'; ctx.fillText(s, x, y); }
function fitText(s, x, y, size, maxW, col, weight = 700) { ctx.font = `${weight} ${size}px ${FONT}`; const w = ctx.measureText(s).width; text(s, x, y, w > maxW ? size * maxW / w : size, col, 'left', weight); }
function emoji(e, x, y, s) { ctx.font = `${s}px ${FONT}`; ctx.textAlign = 'center'; ctx.textBaseline = 'middle'; ctx.fillStyle = '#000'; ctx.fillText(e, x, y); ctx.textBaseline = 'alphabetic'; }

// ---------- sound (all synthesized, no files) ----------
let ac = null;
function audio() { try { if (!ac) ac = new (window.AudioContext || window.webkitAudioContext)(); if (ac.state === 'suspended') ac.resume(); } catch (e) { } }
function tone(f0, f1, dur, vol = 0.1, type = 'sine', delay = 0) {
  if (!ac) return;
  const t = ac.currentTime + delay, o = ac.createOscillator(), g = ac.createGain();
  o.type = type; o.frequency.setValueAtTime(f0, t); o.frequency.exponentialRampToValueAtTime(f1, t + dur);
  g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(0.001, t + dur);
  o.connect(g).connect(ac.destination); o.start(t); o.stop(t + dur + 0.02);
}
function noise(dur, vol = 0.1, freq = 2000) {
  if (!ac) return;
  const n = Math.floor(ac.sampleRate * dur), b = ac.createBuffer(1, n, ac.sampleRate), d = b.getChannelData(0);
  for (let i = 0; i < n; i++) d[i] = (Math.random() * 2 - 1) * (1 - i / n);
  const s = ac.createBufferSource(), f = ac.createBiquadFilter(), g = ac.createGain();
  s.buffer = b; f.type = 'bandpass'; f.frequency.value = freq; g.gain.value = vol;
  s.connect(f).connect(g).connect(ac.destination); s.start();
}
const SFX = {
  pop: () => tone(500, 900, 0.08, 0.08, 'triangle'),
  fis: () => { noise(0.3, 0.35, 3500); tone(900, 400, 0.15, 0.04, 'triangle'); },
  scrub: () => noise(0.07, 0.08, 1400),
  buzz: () => tone(120, 110, 0.07, 0.05, 'sawtooth'),
  water: () => noise(0.14, 0.1, 800),
  air: () => noise(0.12, 0.07, 450),
  steam: () => noise(0.2, 0.06, 5500),
  stick: () => tone(700, 1300, 0.07, 0.07, 'square'),
  paint: () => tone(300, 700, 0.1, 0.06, 'sine'),
  done: () => { tone(660, 660, 0.12, 0.1, 'triangle'); tone(880, 880, 0.12, 0.1, 'triangle', 0.12); tone(1320, 1320, 0.25, 0.1, 'triangle', 0.24); },
  coin: () => { tone(1200, 1200, 0.08, 0.1, 'square'); tone(1800, 1800, 0.3, 0.1, 'square', 0.08); },
  no: () => tone(300, 200, 0.18, 0.08, 'square'),
};
const sndT = {};
function sfx(k, gap = 0) { const n = performance.now(); if (gap && n - (sndT[k] || 0) < gap) return; sndT[k] = n; SFX[k](); }

// ---------- data ----------
const NAIL_COLS = [['#1c1c1c', 'Siyah'], ['#e8434f', 'Kırmızı'], ['#ff6fb5', 'Pembe'], ['#8b5cf6', 'Mor'], ['#3b82f6', 'Mavi'],
  ['#1fc7c7', 'Turkuaz'], ['#2fd27a', 'Yeşil'], ['#ffd23f', 'Sarı'], ['#ffffff', 'Beyaz'], ['#ff8a1f', 'Turuncu']];
const colName = c => (NAIL_COLS.find(e => e[0] === c) || [c, c])[1];
const SHAPES = { square: 'Küt', round: 'Yuvarlak', pointy: 'Sivri' };
const LENS = { long: 'Uzun', short: 'Kısa' };
const STICKERS = { moon: ['🌙', 'Ay'], star: ['⭐', 'Yıldız'], heart: ['💖', 'Kalp'], flower: ['🌸', 'Çiçek'] };
const SKINS = ['#f6d2b0', '#eec39a', '#d9a37a', '#a8704a', '#7a4b2e'];
const HAIRS = ['#1c1c1c', '#3b2314', '#6b3e1f', '#a87444', '#e0b04a', '#c0392b', '#ff6fb5', '#8b5cf6'];
const GIRL_NAMES = ['Elif', 'Zeynep', 'Ada', 'Defne', 'Mira', 'Lina', 'Duru', 'Nehir', 'Ela', 'Nil'];
const BOY_NAMES = ['Can', 'Efe', 'Mert', 'Arda', 'Kaan', 'Ege', 'Kuzey', 'Toprak'];
// price per step; the first customer's full list adds up to 30 TL
const STEP_INFO = {
  nails: { title: '💅 Tırnak', price: 8 },
  stickers: { title: '✨ Sticker', price: 4 },
  cream: { title: '🧴 El kremi', price: 3 },
  shave: { title: '🪒 Tıraş', price: 4 },
  razor: { title: '🫧 Jilet temizliği', price: 0 },
  wash: { title: '🚿 Saç yıkama', price: 4 },
  comb: { title: '💇 Tarama', price: 2 },
  dry: { title: '💨 Kurutma', price: 2 },
  style: { title: '💫 Saç şekli', price: 3 },
};
const HAND_STEPS = new Set(['nails', 'stickers', 'cream']);
const DEFAULT_TOOL = { nails: 'clean', stickers: null, cream: 'cream', shave: 'razor', razor: 'razor', wash: 'shampoo', comb: 'comb', dry: 'dryer', style: 'iron' };

// work-view geometry
const S = 1.3;                                              // hand scale
const HANDS = [{ x: 280, y: 450, t: 1 }, { x: 720, y: 450, t: -1 }]; // t: thumb side (thumbs point inward)
const FX = 420, FY = 290, FS = 1.4;                          // face view: head centre + scale
const BOWL = { x: 810, y: 560, rx: 130, ry: 52 };

// ---------- state ----------
let T = 0, scene = 'title', cust = null, stepIdx = 0, stepDone = false, tool = null, polish = '#1c1c1c', held = null;
let parts = [], toast = null, money = 0, served = 0, bill = null, leaveT = 0, razorHair = 0, bowlHair = 0, tube = 5, foamD = 0;
try { const s = JSON.parse(localStorage.getItem('yv-salon') || 'null'); if (s) { money = s.money || 0; served = s.served || 0; } } catch (e) { }
function save() { try { localStorage.setItem('yv-salon', JSON.stringify({ money, served })); } catch (e) { } }

// ---------- customers ----------
function makeCustomer(isFirst) {
  const girl = isFirst || Math.random() < 0.65;
  const c = {
    name: isFirst ? 'Buse' : pick(girl ? GIRL_NAMES : BOY_NAMES), girl, first: isFirst,
    skin: isFirst ? '#eec39a' : pick(SKINS), hairCol: isFirst ? '#4a2c17' : pick(HAIRS),
    eyes: pick(['#5b3a1e', '#2d7ff9', '#2fa35a', '#1c1c1c']),
    cloth: pick(['#8b5cf6', '#2fd27a', '#ff8a1f', '#3b82f6', '#e8434f', '#1fc7c7']), shoe: pick(['#1c1c1c', '#ffffff', '#e8434f', '#3b82f6']),
    seed: Math.random() * 10, x: 1160, walk: 0,
  };
  const r = c.req = {
    nailColor: isFirst ? '#1c1c1c' : pick(NAIL_COLS)[0],
    nailLen: isFirst ? 'long' : pick(['long', 'short']),
    nailShape: isFirst ? 'square' : pick(Object.keys(SHAPES)),
    sticker: isFirst ? 'moon' : Math.random() < 0.6 ? pick(Object.keys(STICKERS)) : null,
    hairStyle: isFirst ? 'wave' : Math.random() < 0.65 ? pick(['wave', 'straight']) : null,
  };
  const cream = isFirst || Math.random() < 0.6;
  const beard = isFirst || (girl ? Math.random() < 0.15 : Math.random() < 0.7);
  const wash = isFirst || Math.random() < 0.7, comb = wash || Math.random() < 0.3;
  c.steps = ['nails', r.sticker && 'stickers', cream && 'cream', beard && 'shave', beard && 'razor',
    wash && 'wash', comb && 'comb', wash && 'dry', r.hairStyle && 'style'].filter(Boolean);
  c.price = c.steps.reduce((a, s) => a + STEP_INFO[s].price, 0);
  c.greet = `Merhaba, ben ${c.name}! ${isFirst ? '🙈' : '😊'}`;
  // hands: dirty, broken nails and dry skin
  c.hands = [0, 1].map(() => ({
    nails: [0, 1, 2, 3, 4].map(() => ({ dirty: 3, len: 'short', shape: 'broken', color: null, sticker: null, scrub: 0, sp: [0, 1, 2].map(() => [rand(-7, 7), rand(-20, 0)]) })),
    blobs: [], rub: 0, soft: !cream, flakes: Array.from({ length: 14 }, () => [rand(-55, 55), rand(-50, 150), rand(0, 6)]),
  }));
  // beard stubble on the chin and jaw + a moustache
  c.beard = [];
  if (beard) {
    for (let i = 0; i < 140; i++) {
      const a = rand(0.08, 0.92) * Math.PI, k = rand(0.55, 0.96), x = Math.cos(a) * 88 * k, y = Math.sin(a) * 96 * k;
      if (y < 34 || (Math.abs(x) < 26 && y < 64)) continue;
      c.beard.push({ x, y, a: rand(-0.3, 0.3) - x / 200, l: rand(6, 11) });
    }
    for (let i = 0; i < 22; i++) { const s = i % 2 ? 1 : -1; c.beard.push({ x: s * rand(6, 28), y: rand(35, 41), a: s * rand(0.3, 0.8), l: rand(5, 9) }); }
  }
  // hair: strands framing the face (interactive) + strands behind (follow the average)
  c.short = !girl && Math.random() < 0.8;
  const len = c.short ? rand(70, 100) : isFirst ? 250 : rand(170, 270);
  const front = [], back = [];
  for (const side of [-1, 1]) for (let j = 0; j < 8; j++) front.push({ sx: side * (76 + j * 7), sy: -72 + j * 5, L: len - j * 6 + rand(-6, 6), front: true });
  for (let i = 0; i < 14; i++) { const sx = -104 + i * 16; back.push({ sx, sy: -95 + (sx / 104) ** 2 * 25, L: len + rand(-6, 6), front: false }); }
  front.sort((a, b) => Math.abs(b.sx) - Math.abs(a.sx));
  c.strands = [...back, ...front].map(s => ({
    ...s, ph: rand(0, 6), wet: 0, blow: 0, nz: Array.from({ length: 13 }, () => rand(-1, 1)),
    tangle: comb ? rand(0.55, 1) : 0,
    wave: r.hairStyle === 'straight' ? rand(0.7, 1) : r.hairStyle === 'wave' ? rand(0, 0.12) : rand(0, 0.35),
  }));
  syncBack(c);
  c.greasy = wash ? 1 : 0;
  c.specks = [];
  if (wash) {
    const F = c.strands.filter(s => s.front);
    for (let i = 0; i < 16; i++) {
      if (i < 6) { const x = rand(-60, 60); c.specks.push({ x, y: rand(-90, -60) + Math.abs(x) * 0.2 }); }
      else { const p = strandPts(pick(F))[Math.floor(rand(2, 12))]; c.specks.push({ x: p[0], y: p[1] }); }
    }
  }
  c.specks0 = c.specks.length || 1;
  c.foam = [];
  return c;
}
function syncBack(c) {
  const F = c.strands.filter(s => s.front), avg = k => F.reduce((a, s) => a + s[k], 0) / F.length;
  const t = avg('tangle'), w = avg('wave'), wet = avg('wet');
  for (const s of c.strands) if (!s.front) { s.tangle = t; s.wave = w; s.wet = wet; }
}
function requestLines(c) {
  const L = [c.first ? 'Çok bakımsız kaldım, yardım eder misin?' : 'Şunları istiyorum:'], r = c.req;
  for (const s of c.steps) {
    if (s === 'nails') L.push(`💅 Tırnaklarım: ${colName(r.nailColor).toLowerCase()}, ${LENS[r.nailLen].toLowerCase()}, ${SHAPES[r.nailShape].toLowerCase()}`);
    else if (s === 'stickers') L.push(`${STICKERS[r.sticker][0]} 10 tırnağa ${STICKERS[r.sticker][1].toLowerCase()} stickerı`);
    else if (s === 'cream') L.push('🧴 İki elime krem');
    else if (s === 'shave') L.push('🪒 Sakallarımı kes');
    else if (s === 'wash') L.push('🚿 Saçımı yıka, tara, kurut');
    else if (s === 'comb' && !c.steps.includes('wash')) L.push('💇 Saçımı tara');
    else if (s === 'style') L.push(r.hairStyle === 'wave' ? '〰️ Saçım dalga dalga olsun' : '📏 Saçım dümdüz olsun');
  }
  return L;
}

// ---------- flow ----------
const curStep = () => cust.steps[stepIdx];
const frontStrands = () => cust.strands.filter(s => s.front);
const allNails = f => cust.hands.every(h => h.nails.every(f));
function newCustomer(isFirst) {
  cust = makeCustomer(isFirst); scene = 'enter'; stepIdx = 0; stepDone = false;
  tool = null; held = null; razorHair = 0; bowlHair = 0; tube = 5; bill = null; leaveT = 0;
}
function startWork() { scene = 'work'; stepIdx = 0; startStep(); }
function startStep() { stepDone = false; held = null; tool = DEFAULT_TOOL[curStep()]; }
function nextStep() {
  stepIdx++;
  if (stepIdx >= cust.steps.length) { scene = 'pay'; cust.x = 520; tool = null; held = null; sparkle(520, 300, 20); return; }
  startStep();
}
function isDone(s) {
  const c = cust, r = c.req, F = frontStrands();
  switch (s) {
    case 'nails': return allNails(n => !n.dirty && n.len === r.nailLen && n.shape === r.nailShape && n.color === r.nailColor);
    case 'stickers': return allNails(n => n.sticker);
    case 'cream': return c.hands.every(h => h.soft);
    case 'shave': return c.beard.length === 0;
    case 'razor': return razorHair <= 0;
    case 'wash': return c.specks.length === 0 && c.foam.length === 0;
    case 'comb': return F.every(s => s.tangle < 0.05);
    case 'dry': return F.every(s => s.wet <= 0.02);
    case 'style': return F.every(s => r.hairStyle === 'wave' ? s.wave >= 0.9 : s.wave <= 0.1);
  }
  return true;
}
function finishStep(s) {
  const c = cust;
  if (s === 'wash') { c.greasy = 0; for (const st of c.strands) st.wet = 1; }
  if (s === 'comb') for (const st of c.strands) st.tangle = 0;
  if (s === 'dry') for (const st of c.strands) st.wet = 0;
  if (s === 'style') for (const st of c.strands) st.wave = c.req.hairStyle === 'wave' ? 1 : 0;
  if (s === 'razor') razorHair = 0;
}
function takeMoney() { bill = { t: 0, x0: cust.x + 80, y0: 470 }; }
function say(t) { if (toast && toast.text === t) { toast.t = 1.6; return; } toast = { text: t, t: 1.6 }; }

// ---------- particles ----------
function part(o) { parts.push({ vx: 0, vy: 0, g: 0, r: 4, col: '#fff', kind: 'dot', rot: 0, ...o, max: o.life }); }
function sparkle(x, y, n = 8) { for (let i = 0; i < n; i++) { const a = rand(0, 6.28), s = rand(60, 180); part({ x, y, vx: Math.cos(a) * s, vy: Math.sin(a) * s, life: rand(0.4, 0.8), kind: 'star', r: rand(5, 9), col: pick(['#ffd23f', '#ff6fb5', '#ffffff', '#b18cff']) }); } }
function bubbles(x, y, n = 6) { for (let i = 0; i < n; i++) part({ x: x + rand(-15, 15), y: y + rand(-10, 10), vx: rand(-30, 30), vy: rand(-80, -30), life: rand(0.5, 1), r: rand(3, 7), kind: 'bub' }); }
function confetti() { for (let i = 0; i < 60; i++) part({ x: rand(40, PANEL - 40), y: rand(-20, 40), vx: rand(-60, 60), vy: rand(50, 200), g: 200, life: rand(1.2, 2), kind: 'conf', r: rand(4, 7), rot: rand(0, 6), col: pick(['#ff6fb5', '#ffd23f', '#2fd27a', '#5aa9ff', '#b18cff']) }); }
function drawParts() {
  for (const p of parts) {
    const a = clamp(p.life / p.max, 0, 1); ctx.globalAlpha = a;
    if (p.kind === 'star') { ctx.fillStyle = p.col; star4(p.x, p.y, p.r); }
    else if (p.kind === 'bub') { ctx.fillStyle = 'rgba(255,255,255,.85)'; circle(p.x, p.y, p.r); ctx.strokeStyle = '#9fd8ff'; ctx.lineWidth = 1.5; ctx.stroke(); }
    else if (p.kind === 'drop') { ctx.fillStyle = '#6cc4ff'; ell(p.x, p.y, p.r * 0.7, p.r); }
    else if (p.kind === 'hair') { ctx.strokeStyle = '#2a1f2e'; ctx.lineWidth = 2.5; const r = p.rot + p.life * 8; line(p.x, p.y, p.x + Math.cos(r) * 8, p.y + Math.sin(r) * 8); }
    else if (p.kind === 'wind') { ctx.strokeStyle = 'rgba(255,255,255,.9)'; ctx.lineWidth = 3; line(p.x, p.y, p.x - p.vx * 0.05, p.y - p.vy * 0.05); }
    else if (p.kind === 'steam') { ctx.fillStyle = 'rgba(255,255,255,.7)'; circle(p.x, p.y, p.r * (2 - a)); }
    else if (p.kind === 'conf') { ctx.fillStyle = p.col; ctx.save(); ctx.translate(p.x, p.y); ctx.rotate(p.rot + p.life * 6); ctx.fillRect(-p.r, -p.r / 2, p.r * 2, p.r); ctx.restore(); }
    else if (p.kind === 'txt') text(p.t, p.x, p.y, 26, p.col, 'center', 800);
    else { ctx.fillStyle = p.col; circle(p.x, p.y, p.r); }
  }
  ctx.globalAlpha = 1;
}

// ---------- input ----------
const ptr = { x: 0, y: 0, px: 0, py: 0, down: false, inside: false };
let buttons = [];
function evPos(e) { const r = cv.getBoundingClientRect(); return [(e.clientX - r.left) / r.width * W, (e.clientY - r.top) / r.height * H]; }
const inBtn = b => ptr.x >= b.x && ptr.x <= b.x + b.w && ptr.y >= b.y && ptr.y <= b.y + b.h;
cv.addEventListener('pointerdown', e => {
  audio(); e.preventDefault();
  try { cv.setPointerCapture(e.pointerId); } catch (err) { }
  [ptr.x, ptr.y] = evPos(e); ptr.px = ptr.x; ptr.py = ptr.y; ptr.inside = true;
  for (let i = buttons.length - 1; i >= 0; i--) if (inBtn(buttons[i])) { sfx('pop'); buttons[i].onClick(); return; }
  ptr.down = true; onDown();
});
cv.addEventListener('pointermove', e => { [ptr.x, ptr.y] = evPos(e); ptr.inside = true; onMove(); ptr.px = ptr.x; ptr.py = ptr.y; });
cv.addEventListener('pointerup', () => { if (ptr.down) onUp(); ptr.down = false; });
cv.addEventListener('pointercancel', () => { ptr.down = false; });
cv.addEventListener('pointerleave', e => { if (e.pointerType === 'mouse') ptr.inside = false; });
cv.addEventListener('contextmenu', e => e.preventDefault());

const lp = () => [(ptr.x - FX) / FS, (ptr.y - FY) / FS]; // pointer in head-local units
function nailAt(px, py) {
  for (let h = 0; h < 2; h++) {
    const H0 = HANDS[h], F = fingerDefs(H0.t);
    for (let i = 0; i < 5; i++) {
      const [bx, by, a, len, w] = F[i];
      const dx = px - (H0.x + bx * S), dy = py - (H0.y + by * S);
      const lx = (dx * Math.cos(a) + dy * Math.sin(a)) / S, ly = (-dx * Math.sin(a) + dy * Math.cos(a)) / S;
      if (Math.abs(lx) < w * 0.6 + 4 && ly > -len - 48 && ly < -len + 34) return cust.hands[h].nails[i];
    }
  }
  return null;
}
function handAt(px, py) {
  for (let h = 0; h < 2; h++) { const dx = (px - HANDS[h].x) / S, dy = (py - HANDS[h].y) / S; if ((dx / 105) ** 2 + ((dy + 30) / 170) ** 2 < 1) return h; }
  return -1;
}

function drawSalonBg() {

  ctx.fillStyle = '#b77a4a'; ctx.fillRect(760, 250, 240, 12);

  ctx.fillStyle = '#c98b5a'; ctx.fillRect(1090, 250, 150, 310); ctx.fillStyle = '#a86a3a'; ctx.fillRect(1104, 264, 122, 296); ctx.fillStyle = '#ffd23f'; circle(1210, 420, 8);
}
function drawSalon() {
  drawSalonBg();

function drawWork() {

  if (HAND_STEPS.has(s)) { drawTable(); drawHand(0); drawHand(1); }

function drawToast() {

function draw() {

  const cur = hide ? 'none' : buttons.some(inBtn) ? 'pointer' : 'default';
  if (cv.style.cursor !== cur) cv.style.cursor = cur;

let last = performance.now();
function frame(now) {
  const dt = Math.min(0.05, (now - last) / 1000); last = now;
  update(dt); draw();
  requestAnimationFrame(frame);
}
